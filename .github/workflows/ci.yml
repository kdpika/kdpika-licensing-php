name: PHP SDK checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: php-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, sodium
          tools: composer:v2
          coverage: none
      - run: composer validate --strict --no-check-publish
      - run: composer install --no-interaction --no-plugins --no-scripts --prefer-dist
      - name: PHP syntax
        run: find src examples tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/standalone.php
